<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tov Hayom</title>
  <meta name="description" content="כל יום מקום אחד מאומת, עם תג אימות ותאריך בדיקה.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo" dir="ltr"><span class="logo-tov">Tov</span> Hayom</h1>
  </header>

  <main id="main" class="page" aria-busy="true">
    <section id="today" aria-label="טיול היום"></section>

    <section id="shelf-section" aria-labelledby="shelf-title" hidden>
      <h2 id="shelf-title" class="section-title">מקומות נוספים</h2>
      <div id="shelf" class="shelf" role="region" aria-labelledby="shelf-title" tabindex="0"></div>
      <div id="shelf-dots" class="dots" aria-hidden="true"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
